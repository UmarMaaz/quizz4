<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS/FPSC MPT Quiz — Set 12</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

<script>
const QUESTIONS = [{"section": "Pakistan Affairs", "q": "The Jhelum River, one of the five rivers of Punjab, originates from:", "opts": ["Tibet", "Verinag spring in Kashmir", "Himachal Pradesh", "Afghanistan"], "ans": 1, "exp": "The Jhelum River originates from the Verinag spring in the Kashmir valley."}, {"section": "Pakistan Affairs", "q": "The Chenab River originates from which region?", "opts": ["Himachal Pradesh, India", "Tibet", "Afghanistan", "Balochistan"], "ans": 0, "exp": "The Chenab River originates in Himachal Pradesh, India, from the confluence of the Chandra and Bhaga rivers."}, {"section": "Pakistan Affairs", "q": "The Ravi River, one of the Punjab rivers, flows through which major Pakistani city?", "opts": ["Faisalabad", "Lahore", "Multan", "Sialkot"], "ans": 1, "exp": "The Ravi River flows through Lahore."}, {"section": "Pakistan Affairs", "q": "The Sutlej River, the easternmost of Punjab's rivers, originates from:", "opts": ["Tibet, near Lake Rakshastal", "Kashmir", "Afghanistan", "Himachal Pradesh only"], "ans": 0, "exp": "The Sutlej River originates from Lake Rakshastal in Tibet."}, {"section": "Pakistan Affairs", "q": "Pakistan's 'Salt Range', a hill system known for mineral resources, is located in which province?", "opts": ["Sindh", "Punjab", "Balochistan", "KP"], "ans": 1, "exp": "The Salt Range is located in northern Punjab."}, {"section": "Pakistan Affairs", "q": "The Sibi region of Balochistan is historically known for hosting which annual event?", "opts": ["Shandur Polo Festival", "Sibi Mela (cattle fair)", "Basant Festival", "Jashn-e-Baharan"], "ans": 1, "exp": "Sibi is known for its annual Sibi Mela, a major cattle fair and cultural festival."}, {"section": "Pakistan Affairs", "q": "The Shandur Pass, host to the world's highest polo ground, connects which two regions?", "opts": ["Chitral and Gilgit", "Swat and Hunza", "Quetta and Kalat", "Multan and Bahawalpur"], "ans": 0, "exp": "Shandur Pass connects Chitral and Gilgit-Baltistan, hosting the famous Shandur Polo Festival."}, {"section": "Pakistan Affairs", "q": "Pakistan's first City University/technology hub initiative, 'Pakistan's Silicon Valley', refers to efforts centered in:", "opts": ["Islamabad's tech parks", "Lahore's industrial zones", "Karachi's IT corridors", "All major cities have IT initiatives"], "ans": 3, "exp": "Pakistan's IT and tech growth has been distributed across Islamabad, Lahore, and Karachi through various tech parks and initiatives."}, {"section": "Pakistan Affairs", "q": "The National Database and Registration Authority (NADRA) is primarily responsible for:", "opts": ["Tax collection", "Citizen identification and civil registration", "Trade regulation", "Education policy"], "ans": 1, "exp": "NADRA manages Pakistan's national identity card system and civil registration database."}, {"section": "Pakistan Affairs", "q": "The Federal Board of Revenue (FBR) is primarily responsible for:", "opts": ["Education policy", "Tax collection and revenue administration", "Foreign affairs", "Defense procurement"], "ans": 1, "exp": "FBR is Pakistan's apex tax collection and revenue administration body."}, {"section": "Current Affairs", "q": "The term 'Inflation' refers to:", "opts": ["A decrease in the general price level", "A general and sustained rise in prices over time", "A fixed exchange rate", "A type of tax"], "ans": 1, "exp": "Inflation refers to a general and sustained increase in the price level of goods and services over time."}, {"section": "Current Affairs", "q": "The term 'GDP (Gross Domestic Product)' measures:", "opts": ["A country's population", "The total value of goods and services produced within a country in a given period", "A country's foreign debt", "Exchange rates"], "ans": 1, "exp": "GDP measures the total monetary value of all goods and services produced within a country's borders in a specific time period."}, {"section": "Current Affairs", "q": "The term 'Fiscal Deficit' refers to:", "opts": ["A surplus in government revenue", "The gap when government spending exceeds its revenue", "A trade surplus", "A balanced budget"], "ans": 1, "exp": "A fiscal deficit occurs when a government's total expenditures exceed its total revenue (excluding borrowing)."}, {"section": "Current Affairs", "q": "The term 'Current Account Deficit' in economics refers to:", "opts": ["A surplus in trade", "When a country's imports of goods, services, and transfers exceed its exports", "A government budget surplus", "A type of tax"], "ans": 1, "exp": "A current account deficit occurs when a country's total imports (goods, services, transfers) exceed its total exports."}, {"section": "Current Affairs", "q": "The term 'Devaluation' of currency refers to:", "opts": ["Increasing a currency's value", "Deliberately reducing a currency's official value relative to others", "Printing more currency", "Banning currency trade"], "ans": 1, "exp": "Devaluation refers to a deliberate downward adjustment of a country's currency value relative to other currencies."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Ghusl' in Islam refers to:", "opts": ["Minor ablution", "Full ritual bath required after certain conditions", "A pilgrimage rite", "A fasting rule"], "ans": 1, "exp": "'Ghusl' refers to the full ritual purification bath required after specific conditions, such as after major impurity."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The concept of 'Amr bil Maroof wa Nahi anil Munkar' in Islam refers to:", "opts": ["Charity giving", "Enjoining good and forbidding wrong", "A pilgrimage rite", "Ritual prayer"], "ans": 1, "exp": "This principle refers to the Islamic duty of commanding good and forbidding evil within society."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Hisbah' in Islamic governance historically referred to:", "opts": ["Tax collection", "An institution for moral and market oversight/accountability", "Military command", "Judicial appointments"], "ans": 1, "exp": "'Hisbah' historically referred to an institution responsible for overseeing public morality, markets, and accountability."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Bait-ul-Maal' in early Islamic governance referred to:", "opts": ["A mosque", "The public treasury", "A court of law", "A military garrison"], "ans": 1, "exp": "'Bait-ul-Maal' refers to the public treasury used for collecting and distributing state revenues, including Zakat."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Islamic concept of 'Khalifa' (vicegerent/steward), as applied to humanity in the Quran, refers to:", "opts": ["Only religious leaders", "Humanity's role as stewards/trustees on Earth", "Political rulers exclusively", "Prophets only"], "ans": 1, "exp": "In the Quranic sense, 'Khalifa' refers to humanity's broader role as stewards or trustees on Earth, responsible before Allah."}, {"section": "English", "q": "'To make a mountain out of a molehill' means:", "opts": ["To build something large", "To exaggerate a minor issue into a major one", "To work very hard", "To climb successfully"], "ans": 1, "exp": "This idiom means to make a small problem seem much more serious than it actually is."}, {"section": "English", "q": "'To put the cart before the horse' means:", "opts": ["To do things in the wrong or illogical order", "To travel efficiently", "To work as a team", "To plan carefully"], "ans": 0, "exp": "This idiom means to do things in the wrong order, putting something before its proper prerequisite."}, {"section": "English", "q": "Choose the word closest in meaning to 'Vehement':", "opts": ["Mild", "Forceful and passionate", "Quiet", "Indecisive"], "ans": 1, "exp": "'Vehement' means showing strong, forceful, and passionate feeling."}, {"section": "English", "q": "Choose the word closest in meaning to 'Conundrum':", "opts": ["An easy task", "A confusing and difficult problem", "A celebration", "A simple solution"], "ans": 1, "exp": "'Conundrum' means a confusing or difficult problem or question."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Pronunciation", "Pronounciation", "Pronunciasion", "Pronuntiation"], "ans": 0, "exp": "The correct spelling is 'Pronunciation'."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Vacuum", "Vaccuum", "Vacume", "Vaccum"], "ans": 0, "exp": "The correct spelling is 'Vacuum'."}, {"section": "English", "q": "Identify the correct sentence:", "opts": ["The jury have reached its verdict.", "The jury has reached its verdict.", "The jury have reached their verdict.", "Both B and C can be correct depending on usage (collective noun as unit vs. members)."], "ans": 3, "exp": "'Jury' as a collective noun can take a singular verb when acting as a unit ('has reached its verdict') or plural when referring to individual members, depending on style convention."}, {"section": "English", "q": "Choose the correct preposition: 'He apologized ___ being late.'", "opts": ["for", "of", "about", "with"], "ans": 0, "exp": "'Apologize for' is the correct idiomatic preposition usage."}, {"section": "General Science & Ability", "q": "If 9 men can build a wall in 20 days, how many days will 15 men take?", "opts": ["10", "12", "14", "16"], "ans": 1, "exp": "9×20=15×x → x=180/15=12."}, {"section": "General Science & Ability", "q": "A sum of Rs. 5,500 is divided between P and Q such that P's share is Rs. 1,500 more than Q's share. Find Q's share.", "opts": ["Rs. 1,500", "Rs. 2,000", "Rs. 2,500", "Rs. 3,000"], "ans": 1, "exp": "Let Q=x, P=x+1500; 2x+1500=5500 → x=2000."}, {"section": "General Science & Ability", "q": "Find the value of 25% of 25% of 400:", "opts": ["20", "25", "30", "35"], "ans": 1, "exp": "25% of 400=100; 25% of 100=25."}, {"section": "General Science & Ability", "q": "If the length of a rectangle is reduced by 10% and width increased by 20%, find the net percentage change in area.", "opts": ["+8%", "+10%", "+12%", "+15%"], "ans": 0, "exp": "New area=0.9×1.2=1.08× original, i.e., an 8% increase."}, {"section": "General Science & Ability", "q": "A man's monthly salary is Rs. 60,000. If he spends 40% on rent, 25% on food, and saves the rest, find his savings.", "opts": ["Rs. 18,000", "Rs. 20,000", "Rs. 21,000", "Rs. 22,000"], "ans": 2, "exp": "Spent=40%+25%=65%; Savings=35% of 60000=Rs. 21,000."}, {"section": "Pakistan Affairs", "q": "The Pakistan Sports Board oversees the promotion of sports including the national game, which is:", "opts": ["Cricket", "Hockey", "Football", "Squash"], "ans": 1, "exp": "Hockey is officially Pakistan's national game, though cricket is more popular."}, {"section": "Pakistan Affairs", "q": "Pakistan won the Cricket World Cup in which year?", "opts": ["1987", "1992", "1996", "1999"], "ans": 1, "exp": "Pakistan won the Cricket World Cup in 1992, under the captaincy of Imran Khan."}, {"section": "Pakistan Affairs", "q": "Pakistan won the Hockey World Cup a record number of times, the last being in:", "opts": ["1982", "1990", "1994", "2000"], "ans": 2, "exp": "Pakistan last won the Hockey World Cup in 1994, holding the record for most titles (4)."}, {"section": "Pakistan Affairs", "q": "Jahangir Khan, a legendary Pakistani squash player, dominated the sport primarily during:", "opts": ["1970s", "1980s", "1990s", "2000s"], "ans": 1, "exp": "Jahangir Khan dominated world squash during the 1980s, with a historic unbeaten streak."}, {"section": "Pakistan Affairs", "q": "Pakistan's first Test cricket match was played in:", "opts": ["1947", "1952", "1958", "1960"], "ans": 1, "exp": "Pakistan played its first Test match in 1952, against India."}, {"section": "Pakistan Affairs", "q": "The Lahore Qalandars, Karachi Kings, and other teams compete in which Pakistani cricket league?", "opts": ["National T20 Cup", "Pakistan Super League (PSL)", "Quaid-e-Azam Trophy", "Pentangular Cup"], "ans": 1, "exp": "These teams compete in the Pakistan Super League (PSL), launched in 2016."}, {"section": "Pakistan Affairs", "q": "The highest civil award in Pakistan is:", "opts": ["Sitara-e-Pakistan", "Nishan-e-Pakistan", "Hilal-e-Pakistan", "Tamgha-e-Pakistan"], "ans": 1, "exp": "Nishan-e-Pakistan is Pakistan's highest civilian award."}, {"section": "Pakistan Affairs", "q": "Pakistan's currency notes are printed by:", "opts": ["State Bank of Pakistan directly", "Pakistan Security Printing Corporation", "Federal Board of Revenue", "Ministry of Finance"], "ans": 1, "exp": "The Pakistan Security Printing Corporation, based in Karachi, prints the country's currency notes."}, {"section": "Pakistan Affairs", "q": "The Pakistan Ordnance Factories, a major defense production complex, is located in:", "opts": ["Islamabad", "Wah Cantt", "Taxila", "Rawalpindi"], "ans": 1, "exp": "Pakistan Ordnance Factories is headquartered in Wah Cantt, Punjab."}, {"section": "Pakistan Affairs", "q": "Heavy Industries Taxila (HIT) is primarily involved in the production of:", "opts": ["Naval vessels", "Tanks and armored vehicles", "Aircraft", "Missiles only"], "ans": 1, "exp": "Heavy Industries Taxila specializes in producing tanks and armored vehicles for the Pakistan Army."}, {"section": "Current Affairs", "q": "The term 'Stagflation' refers to an economic situation combining:", "opts": ["High growth and low inflation", "Stagnant growth and high inflation", "High growth and high inflation", "Deflation and high growth"], "ans": 1, "exp": "Stagflation refers to the unusual combination of stagnant economic growth, high unemployment, and high inflation."}, {"section": "Current Affairs", "q": "The term 'Quantitative Easing' refers to:", "opts": ["Reducing the money supply", "A central bank policy of increasing money supply by purchasing assets", "Raising taxes", "A trade tariff"], "ans": 1, "exp": "Quantitative easing is a monetary policy where central banks purchase securities to increase money supply and stimulate the economy."}, {"section": "Current Affairs", "q": "The term 'Balance of Payments' refers to:", "opts": ["A country's budget deficit only", "A record of all economic transactions between a country and the rest of the world", "Only trade in goods", "Government tax revenue"], "ans": 1, "exp": "The balance of payments records all economic transactions (trade, investment, transfers) between a country and the rest of the world."}, {"section": "Current Affairs", "q": "The term 'Subsidy' in economics refers to:", "opts": ["A tax on goods", "Financial assistance given by the government to reduce costs/prices", "A trade tariff", "A type of loan with high interest"], "ans": 1, "exp": "A subsidy is financial assistance provided by the government to support an industry or reduce the price of goods/services."}, {"section": "Current Affairs", "q": "The term 'Privatization' refers to:", "opts": ["Government takeover of private businesses", "Transfer of ownership of businesses/assets from public to private sector", "Nationalizing industries", "Increasing government spending"], "ans": 1, "exp": "Privatization refers to transferring ownership or control of government-owned enterprises to the private sector."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Istikhara' in Islam refers to:", "opts": ["A pilgrimage rite", "A prayer seeking Allah's guidance in decision-making", "A charity fund", "A fasting rule"], "ans": 1, "exp": "'Istikhara' is a prayer performed to seek Allah's guidance when making an important decision."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Sabr' in Islamic ethics refers to:", "opts": ["Anger", "Patience and perseverance", "Charity", "Pilgrimage"], "ans": 1, "exp": "'Sabr' refers to patience and perseverance, a highly valued trait in Islamic ethics."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Shukr' in Islam refers to:", "opts": ["Patience", "Gratitude to Allah", "Charity", "Repentance"], "ans": 1, "exp": "'Shukr' refers to gratitude and thankfulness toward Allah."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Tawbah' in Islam refers to:", "opts": ["Charity", "Repentance and turning back to Allah", "Pilgrimage", "Fasting"], "ans": 1, "exp": "'Tawbah' refers to sincere repentance and turning back to Allah after sin."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Istighfar' refers to:", "opts": ["Seeking forgiveness from Allah", "A pilgrimage rite", "A charity payment", "A specific fast"], "ans": 0, "exp": "'Istighfar' refers to the act of seeking Allah's forgiveness."}, {"section": "English", "q": "'Barking up the wrong tree' means:", "opts": ["To shout loudly", "To pursue a mistaken or misguided course of action", "To train a dog", "To climb a tree"], "ans": 1, "exp": "This idiom means to pursue a mistaken line of thought or action, directing effort at the wrong target."}, {"section": "English", "q": "'To steal someone's thunder' means:", "opts": ["To physically steal something", "To take credit for someone else's achievement or draw attention away from them", "To cause a storm", "To argue loudly"], "ans": 1, "exp": "This idiom means to take attention or credit away from someone else's achievement."}, {"section": "English", "q": "Choose the word closest in meaning to 'Garrulous':", "opts": ["Quiet", "Excessively talkative", "Serious", "Shy"], "ans": 1, "exp": "'Garrulous' means excessively talkative, especially about trivial matters."}, {"section": "English", "q": "Choose the word closest in meaning to 'Sagacious':", "opts": ["Foolish", "Wise and shrewd", "Careless", "Weak"], "ans": 1, "exp": "'Sagacious' means having or showing keen judgment; wise."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Consensus", "Concensus", "Consensis", "Concencus"], "ans": 0, "exp": "The correct spelling is 'Consensus'."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Irresistible", "Irresistable", "Iresistible", "Irressistible"], "ans": 0, "exp": "The correct spelling is 'Irresistible'."}, {"section": "English", "q": "Identify the correct sentence:", "opts": ["Either of the answers are correct.", "Either of the answers is correct.", "Either of answer is correct.", "Either answers is correct."], "ans": 1, "exp": "'Either' takes a singular verb: 'Either of the answers is correct.'"}, {"section": "English", "q": "Choose the correct preposition: 'She is capable ___ handling the situation.'", "opts": ["of", "for", "with", "about"], "ans": 0, "exp": "'Capable of' is the correct idiomatic preposition usage."}, {"section": "General Science & Ability", "q": "If 4 taps can fill a tank in 6 hours, how long will 3 taps take to fill the same tank?", "opts": ["7 hours", "7.5 hours", "8 hours", "9 hours"], "ans": 2, "exp": "4×6=3×x → x=24/3=8 hours."}, {"section": "General Science & Ability", "q": "A sum of Rs. 11,000 is lent at 9% simple interest for 2 years. Find the total amount to be repaid.", "opts": ["Rs. 12,580", "Rs. 12,980", "Rs. 13,000", "Rs. 13,200"], "ans": 1, "exp": "SI=(11000×9×2)/100=1980; Amount=11000+1980=Rs. 12,980."}, {"section": "General Science & Ability", "q": "Find the next term: 2, 6, 18, 54, 162, ?", "opts": ["324", "486", "648", "729"], "ans": 1, "exp": "Each term is multiplied by 3: 162×3=486."}, {"section": "General Science & Ability", "q": "If the HCF of two numbers is 6 and their LCM is 72, and one number is 18, find the other.", "opts": ["20", "24", "28", "30"], "ans": 1, "exp": "Product of numbers=HCF×LCM=6×72=432; other number=432/18=24."}, {"section": "General Science & Ability", "q": "A sum of money becomes 5/4 of itself in 3 years at simple interest. Find the rate of interest.", "opts": ["6.25%", "7.5%", "8.33%", "10%"], "ans": 2, "exp": "SI=1/4 of P over 3 years; Rate=(1/4×100)/3=8.33%."}, {"section": "Pakistan Affairs", "q": "The National Highway Authority (NHA) is primarily responsible for:", "opts": ["Education policy", "Construction and maintenance of national highways and motorways", "Tax collection", "Foreign trade"], "ans": 1, "exp": "The NHA manages the planning, construction, and maintenance of Pakistan's national highways and motorway network."}, {"section": "Pakistan Affairs", "q": "WAPDA (Water and Power Development Authority) was established to primarily oversee:", "opts": ["Education", "Water resources and power generation", "Trade policy", "Defense production"], "ans": 1, "exp": "WAPDA oversees the development and management of water resources and power generation infrastructure."}, {"section": "Pakistan Affairs", "q": "The Pakistan Atomic Energy Commission (PAEC) is responsible for:", "opts": ["Space exploration", "Nuclear energy and related research", "Foreign trade", "Education policy"], "ans": 1, "exp": "PAEC oversees Pakistan's nuclear energy programs and related scientific research."}, {"section": "Pakistan Affairs", "q": "The Higher Education Commission (HEC) of Pakistan was established in:", "opts": ["1990", "2000", "2002", "2010"], "ans": 2, "exp": "The HEC was established in 2002, replacing the University Grants Commission."}, {"section": "Pakistan Affairs", "q": "Pakistan's largest English-language newspaper by circulation/history is often considered to be:", "opts": ["The News", "Dawn", "The Express Tribune", "Business Recorder"], "ans": 1, "exp": "Dawn, founded by Jinnah in 1941, is among Pakistan's most prominent English-language newspapers."}, {"section": "Current Affairs", "q": "The term 'Microfinance' refers to:", "opts": ["Large corporate loans", "Small-scale financial services for low-income individuals/entrepreneurs", "Government bonds", "International trade finance"], "ans": 1, "exp": "Microfinance refers to providing small loans and financial services to low-income individuals who lack access to traditional banking."}, {"section": "Current Affairs", "q": "The term 'Remittances' refers to:", "opts": ["Government subsidies", "Money sent by migrants/workers abroad to their home country", "Fore const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
